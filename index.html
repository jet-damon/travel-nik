<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nik Travel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 32px; font-weight: 700; color: #fff; }
        header .subtitle { color: #888; font-size: 14px; margin-top: 6px; }
        .trip-card { display: block; background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 16px; text-decoration: none; color: inherit; transition: border-color 0.2s; }
        .trip-card:hover { border-color: #444; }
        .trip-card h2 { font-size: 18px; color: #fff; margin-bottom: 4px; }
        .trip-card .dates { font-size: 14px; color: #f59e0b; }
        .trip-card .desc { font-size: 13px; color: #888; margin-top: 8px; }

        /* PIN LOCK */
        #lockScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #lockScreen.unlocked { display: none; }
        .lock-icon { font-size: 48px; margin-bottom: 16px; }
        .lock-title { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 8px; }
        .lock-subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }
        .pin-dots { display: flex; gap: 16px; margin-bottom: 40px; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #333; transition: all 0.2s; }
        .pin-dot.filled { background: #f59e0b; border-color: #f59e0b; }
        .pin-dot.error { background: #ef4444; border-color: #ef4444; animation: shake 0.4s; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 16px; }
        .pin-btn { width: 72px; height: 72px; border-radius: 50%; border: 1px solid #333; background: #141414; color: #fff; font-size: 28px; font-weight: 300; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; user-select: none; }
        .pin-btn:active { background: #f59e0b; color: #000; transform: scale(0.95); }
        .pin-btn-sub { font-size: 10px; color: #555; letter-spacing: 2px; margin-top: 2px; }
        .pin-btn-wrap { display: flex; flex-direction: column; align-items: center; }
        .pin-delete { color: #888; font-size: 14px; font-weight: 500; background: transparent; border: none; }
        .pin-delete:active { color: #f59e0b; }
    </style>
</head>
<body>
    <div id="lockScreen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Nik Travel</div>
        <div class="lock-subtitle">Enter PIN to continue</div>
        <div class="pin-dots">
            <div class="pin-dot" id="dot0"></div>
            <div class="pin-dot" id="dot1"></div>
            <div class="pin-dot" id="dot2"></div>
            <div class="pin-dot" id="dot3"></div>
        </div>
        <div class="pin-pad">
            <div class="pin-btn" onclick="pinPress('1')"><div class="pin-btn-wrap">1</div></div>
            <div class="pin-btn" onclick="pinPress('2')"><div class="pin-btn-wrap">2<div class="pin-btn-sub">ABC</div></div></div>
            <div class="pin-btn" onclick="pinPress('3')"><div class="pin-btn-wrap">3<div class="pin-btn-sub">DEF</div></div></div>
            <div class="pin-btn" onclick="pinPress('4')"><div class="pin-btn-wrap">4<div class="pin-btn-sub">GHI</div></div></div>
            <div class="pin-btn" onclick="pinPress('5')"><div class="pin-btn-wrap">5<div class="pin-btn-sub">JKL</div></div></div>
            <div class="pin-btn" onclick="pinPress('6')"><div class="pin-btn-wrap">6<div class="pin-btn-sub">MNO</div></div></div>
            <div class="pin-btn" onclick="pinPress('7')"><div class="pin-btn-wrap">7<div class="pin-btn-sub">PQRS</div></div></div>
            <div class="pin-btn" onclick="pinPress('8')"><div class="pin-btn-wrap">8<div class="pin-btn-sub">TUV</div></div></div>
            <div class="pin-btn" onclick="pinPress('9')"><div class="pin-btn-wrap">9<div class="pin-btn-sub">WXYZ</div></div></div>
            <div class="pin-btn pin-delete" onclick="pinDelete()"></div>
            <div class="pin-btn" onclick="pinPress('0')"><div class="pin-btn-wrap">0</div></div>
            <div class="pin-btn pin-delete" onclick="pinDelete()">⌫</div>
        </div>
    </div>
    <script>
    (function() {
        var PIN = '3690';
        var pin = '';
        var dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];
        if (sessionStorage.getItem('travel-unlocked') === 'true') {
            document.getElementById('lockScreen').style.display = 'none';
        }
        window.pinPress = function(n) {
            if (pin.length >= 4) return;
            pin += n;
            dots[pin.length - 1].classList.add('filled');
            if (pin.length === 4) {
                if (pin === PIN) {
                    sessionStorage.setItem('travel-unlocked', 'true');
                    var ls = document.getElementById('lockScreen');
                    ls.style.transition = 'opacity 0.3s';
                    ls.style.opacity = '0';
                    setTimeout(function() { ls.style.display = 'none'; }, 300);
                } else {
                    for (var i = 0; i < dots.length; i++) { dots[i].classList.remove('filled'); dots[i].classList.add('error'); }
                    setTimeout(function() { for (var i = 0; i < dots.length; i++) { dots[i].classList.remove('error'); } pin = ''; }, 500);
                }
            }
        };
        window.pinDelete = function() {
            if (pin.length > 0) {
                dots[pin.length - 1].classList.remove('filled');
                pin = pin.slice(0, -1);
            }
        };
    })();
    </script>

    <div class="container">
        <header>
            <h1>✈️ Nik Travel</h1>
            <div class="subtitle">All trips, one place</div>
        </header>

        <a href="miami-mar-2026.html" class="trip-card">
            <h2>🌴 Miami — Music Week & Beyond</h2>
            <div class="dates">March 23 — April 6, 2026</div>
            <div class="desc">JSX to Ft Lauderdale → Troy's apartment → MMW yacht party → One K opening set → In-person podcasts → Local spots</div>
        </a>
    </div>
</body>
</html>
